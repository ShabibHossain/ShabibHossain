<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="800" height="20" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fcd12a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fcd12a"/>
      <stop offset="1" stop-color="#fcd12a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes sweep { 0% { transform: translateX(-260px); opacity: 0 } 15% { opacity: 1 } 85% { opacity: 1 } 100% { transform: translateX(260px); opacity: 0 } }
    .bar { animation: sweep 3.6s ease-in-out infinite }
  </style>
  <rect x="150" y="9" width="500" height="2" rx="1" fill="#fcd12a" opacity=".25"/>
  <rect class="bar" x="270" y="8" width="260" height="4" rx="2" fill="url(#g)"/>
</svg>

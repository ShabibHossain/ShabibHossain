<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    @media (prefers-color-scheme: dark) { text { fill: #f0f6fc; } .sub { fill: #9198a1 !important; } }
    .sub { fill: #59636e; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(18px) } 100% { opacity: 1; transform: translateY(0) } }
    @keyframes grow { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }
    .t1 { animation: rise .9s cubic-bezier(.2,.8,.2,1) 3.3s 1 both }
    .t2 { animation: rise .9s cubic-bezier(.2,.8,.2,1) 3.7s 1 both }
    .bar { transform-origin: 400px 128px; animation: grow .9s cubic-bezier(.2,.8,.2,1) 4.1s 1 both }
  </style>
  <text class="t1" x="400" y="62" text-anchor="middle" font-size="48" font-weight="800">Hey, I'm YOUR_NAME</text>
  <text class="t2 sub" x="400" y="104" text-anchor="middle" font-size="22">Games. Android apps. Minecraft mods.</text>
  <rect class="bar" x="340" y="124" width="120" height="4" rx="2" fill="#fcd12a"/>
</svg>
